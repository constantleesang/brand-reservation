<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>관리자 페이지 - 신발 DB 구축 신청 현황</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background: #f4f6f9; padding: 20px; }
        .container { max-width: 1100px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #003366; border-bottom: 2px solid #003366; padding-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .section { margin-top: 30px; }
        .date-section { margin-bottom: 20px; background: #f9fbfd; padding: 15px; border-radius: 8px; border: 1px solid #e1e4e8; }
        .date-section h4 { margin: 0 0 10px 0; color: #003366; }
        .slot-card { display: inline-flex; align-items: center; background: #fff; border: 1px solid #ccc; padding: 6px 10px; border-radius: 6px; margin: 4px; gap: 6px; font-size: 13px; }
        .btn-toggle { padding: 4px 8px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; color: white; }
        .active-on { background: #28a745; }
        .active-off { background: #dc3545; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; font-size: 14px; }
        th { background: #003366; color: white; }
        .badge { display: inline-block; padding: 3px 8px; background: #e9ecef; border-radius: 4px; font-weight: bold; color: #495057; font-size: 12px; }
        .btn-excel { background: #28a745; color: white; border: none; padding: 8px 16px; font-size: 14px; font-weight: bold; border-radius: 6px; cursor: pointer; }
        .btn-excel:hover { background: #218838; }
        .table-header-flex { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; }
        input[type="number"] { width: 45px; padding: 3px; text-align: center; border: 1px solid #bbb; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>
            관리자 대시보드 - 신발 DB 구축 신청 관리
        </h2>

        <!-- 날짜별 시간대별 제어 섹션 -->
        <div class="section">
            <h3>⏰ 날짜별 예약 시간대 활성화 및 제한 인원 설정</h3>
            <div id="dateSlotsControlContainer"></div>
        </div>

        <!-- 전체 신청자 현황 -->
        <div class="section">
            <div class="table-header-flex">
                <h3 style="margin:0;">📋 전체 신청자 목록 (신청번호 및 브랜드 순서 포함)</h3>
                <button class="btn-excel" onclick="downloadExcel()">📊 엑셀 다운로드</button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>신청번호</th>
                        <th>신청시간</th>
                        <th>이름</th>
                        <th>연락처</th>
                        <th>학과</th>
                        <th>학번</th>
                        <th>브랜드</th>
                        <th>사이즈 / 순서</th>
                        <th>방문일정</th>
                        <th>상태</th>
                    </tr>
                </thead>
                <tbody id="reservationTableBody">
                    <tr><td colspan="10">데이터를 불러오는 중...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let previousReservationCount = -1;
        let cachedReservations = []; // 엑셀 다운로드용 데이터 보관

        async function loadAdminData() {
            try {
                // 1. 날짜별 시간대 관리 목록 로드
                const slotRes = await fetch('/api/time-slots');
                const slots = await slotRes.json();
                
                // 예약 내역도 함께 가져와서 현재 몇 명이 신청했는지 카드에 표시
                const res = await fetch('/api/reservations');
                const data = await res.json();
                cachedReservations = data;

                const controlContainer = document.getElementById('dateSlotsControlContainer');
                controlContainer.innerHTML = '';

                // 날짜별 그룹화
                const dates = ['10월 7일', '10월 8일', '10월 12일'];
                dates.forEach(date => {
                    const dateBox = document.createElement('div');
                    dateBox.className = 'date-section';
                    dateBox.innerHTML = `<h4>📅 ${date}</h4>`;
                    const wrapper = document.createElement('div');
                    wrapper.style.display = 'flex';
                    wrapper.style.gap = '8px';
                    wrapper.style.flexWrap = 'wrap';

                    // 시간순으로 정렬하여 17:00, 17:30 등 모든 시간대가 순서대로 표시되도록 수정
                    const dateSlots = slots
                        .filter(s => s.date === date)
                        .sort((a, b) => a.time.localeCompare(b.time));

                    dateSlots.forEach(slot => {
                        // 해당 시간대에 예약된 인원 수 계산
                        const currentBookedCount = data.filter(i => i.date === date && i.time === slot.time && i.status !== 'cancelled').length;

                        const card = document.createElement('div');
                        card.className = 'slot-card';
                        card.innerHTML = `
                            <b>${slot.time}</b>
                            <span style="color:#666; font-size:11px;">(${currentBookedCount}/${slot.max_capacity}명)</span>
                            <button class="btn-toggle ${slot.is_active ? 'active-on' : 'active-off'}" onclick="toggleTimeSlot(${slot.id}, ${!slot.is_active})">
                                ${slot.is_active ? '활성' : '마감'}
                            </button>
                            <input type="number" id="cap_${slot.id}" value="${slot.max_capacity}" min="1" max="50">
                            <button onclick="updateCapacity(${slot.id})" style="padding:3px 6px; font-size:11px; cursor:pointer;">설정</button>
                        `;
                        wrapper.appendChild(card);
                    });

                    dateBox.appendChild(wrapper);
                    controlContainer.appendChild(dateBox);
                });

                const tbody = document.getElementById('reservationTableBody');
                
                // 새로운 신청 감지 알림 기능 (처음 로딩 제외)
                if (previousReservationCount !== -1 && data.length > previousReservationCount) {
                    alert('🚨 새로운 예약 신청이 접수되었습니다!');
                }
                previousReservationCount = data.length;

                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="10">신청 내역이 없습니다.</td></tr>';
                    return;
                }

                const sortedForOrder = [...data].sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt));

                let html = '';
                data.forEach((item, index) => {
                    const formattedTime = new Date(item.createdAt).toLocaleString('ko-KR');
                    
                    const matchingItems = sortedForOrder.filter(i => i.brand === item.brand && i.shoeSize === item.shoeSize && i.status !== 'cancelled');
                    const itemSeq = matchingItems.findIndex(i => i.id === item.id) + 1;
                    const seqBadge = (item.status !== 'cancelled' && itemSeq > 0) ? `<span class="badge">[${itemSeq}번째]</span>` : '';

                    html += `
                        <tr>
                            <td><b>#${data.length - index}</b></td>
                            <td>${formattedTime}</td>
                            <td><b>${item.name}</b></td>
                            <td>${item.phone}</td>
                            <td>${item.department}</td>
                            <td>${item.studentId}</td>
                            <td>${item.brand}</td>
                            <td>${item.shoeSize}mm ${seqBadge}</td>
                            <td>${item.date} ${item.time}</td>
                            <td><span style="color:${item.status === 'confirmed' ? 'green' : 'red'}; font-weight:bold;">${item.status === 'confirmed' ? '신청완료' : item.status}</span></td>
                        </tr>
                    `;
                });
                tbody.innerHTML = html;
            } catch (err) {
                console.error('관리자 데이터 로드 실패:', err);
            }
        }

        async function toggleTimeSlot(id, isActive) {
            try {
                const res = await fetch(`/api/time-slots/${id}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ isActive })
                });
                const result = await res.json();
                if (result.success) {
                    loadAdminData();
                } else {
                    alert('변경 실패');
                }
            } catch (err) {
                alert('통신 오류 발생');
            }
        }

        async function updateCapacity(id) {
            const inputVal = document.getElementById(`cap_${id}`).value;
            const maxCapacity = Number(inputVal);
            if (!maxCapacity || maxCapacity < 1) {
                return alert('올바른 인원 수를 입력해주세요.');
            }

            try {
                const res = await fetch(`/api/time-slots/${id}/capacity`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ maxCapacity })
                });
                const result = await res.json();
                if (result.success) {
                    alert('최대 제한 인원이 변경되었습니다.');
                    loadAdminData();
                } else {
                    alert('인원 변경 실패');
                }
            } catch (err) {
                alert('통신 오류 발생');
            }
        }

        // 엑셀 다운로드 기능 함수
        function downloadExcel() {
            if (!cachedReservations || cachedReservations.length === 0) {
                return alert('다운로드할 신청 데이터가 없습니다.');
            }

            let excelHtml = `
                <html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">
                <head><meta charset="utf-8"></head>
                <body>
                <table border="1">
                    <thead>
                        <tr style="background:#003366; color:#ffffff;">
                            <th>신청번호</th>
                            <th>신청시간</th>
                            <th>이름</th>
                            <th>연락처</th>
                            <th>학과</th>
                            <th>학번</th>
                            <th>브랜드</th>
                            <th>사이즈</th>
                            <th>방문일정</th>
                            <th>상태</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            cachedReservations.forEach((item, index) => {
                const formattedTime = new Date(item.createdAt).toLocaleString('ko-KR');
                const statusText = item.status === 'confirmed' ? '신청완료' : item.status;
                excelHtml += `
                    <tr>
                        <td>#${cachedReservations.length - index}</td>
                        <td>${formattedTime}</td>
                        <td>${item.name}</td>
                        <td>${item.phone}</td>
                        <td>${item.department}</td>
                        <td>${item.studentId}</td>
                        <td>${item.brand}</td>
                        <td>${item.shoeSize}mm</td>
                        <td>${item.date} ${item.time}</td>
                        <td>${statusText}</td>
                    </tr>
                `;
            });

            excelHtml += `
                    </tbody>
                </table>
                </body>
                </html>
            `;

            const blob = new Blob([excelHtml], { type: 'application/vnd.ms-excel' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `신발DB구축_신청목록_${new Date().toISOString().slice(0, 10)}.xls`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            window.URL.revokeObjectURL(url);
        }

        // 초기 로드 및 5초마다 자동 실시간 갱신 (신규 신청 감지용)
        loadAdminData();
        setInterval(loadAdminData, 5000);
    </script>
</body>
</html>
