<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>관리자 페이지 - 신발 DB 구축 신청 현황</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background: #f4f6f9; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #003366; border-bottom: 2px solid #003366; padding-bottom: 10px; }
        .section { margin-top: 30px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; font-size: 14px; }
        th { background: #003366; color: white; }
        .btn-toggle { padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .active-on { background: #28a745; color: white; }
        .active-off { background: #dc3545; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <h2>관리자 대시보드 - 신발 DB 구축 신청 관리</h2>

        <!-- 시간대별 제어 섹션 -->
        <div class="section">
            <h3>⏰ 예약 시간대 활성화 / 마감 관리</h3>
            <div id="timeSlotsControl" style="display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px;"></div>
        </div>

        <!-- 전체 신청자 현황 -->
        <div class="section">
            <h3>📋 전체 신청자 목록 (신청 시간 포함)</h3>
            <table>
                <thead>
                    <tr>
                        <th>신청시간</th>
                        <th>이름</th>
                        <th>연락처</th>
                        <th>학과</th>
                        <th>학번</th>
                        <th>브랜드</th>
                        <th>사이즈</th>
                        <th>방문일정</th>
                        <th>상태</th>
                    </tr>
                </thead>
                <tbody id="reservationTableBody">
                    <tr><td colspan="9">데이터를 불러오는 중...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        async function loadAdminData() {
            // 1. 시간대 관리 목록 로드
            const slotRes = await fetch('/api/time-slots');
            const slots = await slotRes.json();
            const slotContainer = document.getElementById('timeSlotsControl');
            slotContainer.innerHTML = '';

            slots.forEach(slot => {
                const btn = document.createElement('button');
                btn.className = `btn-toggle ${slot.is_active ? 'active-on' : 'active-off'}`;
                btn.textContent = `${slot.time} (${slot.is_active ? '활성' : '마감'})`;
                btn.onclick = () => toggleTimeSlot(slot.time, !slot.is_active);
                slotContainer.appendChild(btn);
            });

            // 2. 전체 예약 목록 로드
            const res = await fetch('/api/reservations');
            const data = await res.json();
            const tbody = document.getElementById('reservationTableBody');
            
            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="9">신청 내역이 없습니다.</td></tr>';
                return;
            }

            let html = '';
            data.forEach(item => {
                const formattedTime = new Date(item.createdAt).toLocaleString('ko-KR');
                html += `
                    <tr>
                        <td>${formattedTime}</td>
                        <td><b>${item.name}</b></td>
                        <td>${item.phone}</td>
                        <td>${item.department}</td>
                        <td>${item.studentId}</td>
                        <td>${item.brand}</td>
                        <td>${item.shoeSize}mm</td>
                        <td>${item.date} ${item.time}</td>
                        <td><span style="color:${item.status === 'confirmed' ? 'green' : 'red'};">${item.status}</span></td>
                    </tr>
                `;
            });
            tbody.innerHTML = html;
        }

        async function toggleTimeSlot(time, isActive) {
            const res = await fetch(`/api/time-slots/${time}`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ isActive })
            });
            const result = await res.json();
            if (result.success) {
                loadAdminData();
            } else {
                alert('변경 실패');
            }
        }

        loadAdminData();
    </script>
</body>
</html>
