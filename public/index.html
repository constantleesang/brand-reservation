<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>2026 CBNU 신발 브랜드별 인솔 DB 구축 참여 신청 페이지</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 600px; background: white; margin: 0 auto; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #003366; margin-bottom: 25px; }
        .form-group { margin-bottom: 18px; }
        label { display: block; font-weight: bold; margin-bottom: 6px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; background: #003366; color: white; border: none; padding: 12px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 10px; }
        button:hover { background: #002244; }
        .disabled-slot { color: #aaa; background: #eee; }
        .section-box { border: 1px solid #e1e4e8; padding: 15px; border-radius: 8px; margin-top: 25px; background: #fafbfc; }
        .checkbox-group { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
        .checkbox-group input { width: auto; }
    </style>
</head>
<body>
    <div class="container">
        <h2>2026 신발 브랜드별 인솔 DB 구축 참여 신청 페이지</h2>
        
        <form id="reservationForm">
            <div class="form-group">
                <label>이름</label>
                <input type="text" id="name" placeholder="성함을 입력하세요">
            </div>
            <div class="form-group">
                <label>연락처 (중복 불가)</label>
                <input type="text" id="phone" placeholder="010-0000-0000">
            </div>
            <div class="form-group">
                <label>소속 (학과)</label>
                <input type="text" id="department" placeholder="예: 기계공학과">
            </div>
            <div class="form-group">
                <label>학번 (중복 불가)</label>
                <input type="text" id="studentId" placeholder="학번 10자리 입력">
            </div>

            <div class="form-group">
                <label>신발 브랜드 선택</label>
                <select id="brand" onchange="updateSizes()">
                    <option value="">브랜드를 선택하세요</option>
                    <option value="나이키">나이키</option>
                    <option value="아디다스">아디다스</option>
                    <option value="뉴발란스">뉴발란스</option>
                    <option value="아식스">아식스</option>
                    <option value="호카">호카</option>
                    <option value="스케쳐스">스케쳐스</option>
                    <option value="휠라">휠라</option>
                </select>
            </div>

            <div class="form-group">
                <label>신발 사이즈 선택 (220~300, 5단위 / 브랜드 선택 후 활성화)</label>
                <select id="shoeSize" disabled>
                    <option value="">먼저 브랜드를 선택해주세요</option>
                </select>
                <small id="sizeNotice" style="color: #666; display: block; margin-top: 4px;"></small>
            </div>

            <div class="form-group">
                <label>방문 예약 날짜 (10월 7일, 8일, 12일)</label>
                <select id="date" onchange="loadTimeSlots()">
                    <option value="">날짜를 먼저 선택하세요</option>
                    <option value="10월 7일">10월 7일</option>
                    <option value="10월 8일">10월 8일</option>
                    <option value="10월 12일">10월 12일</option>
                </select>
            </div>

            <div class="form-group">
                <label>예약 시간 선택 (날짜 선택 후 활성화)</label>
                <select id="time" disabled>
                    <option value="">날짜를 먼저 선택하세요</option>
                </select>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="privacyAgreed">
                <label for="privacyAgreed" style="font-weight:normal; margin:0;">[필수] 개인정보 수집 및 이용에 동의합니다.</label>
            </div>

            <button type="submit">예약 완료하기</button>
        </form>

        <!-- 내 예약 조회 섹션 -->
        <div class="section-box">
            <h3>🔍 내 예약 조회 및 취소</h3>
            <div class="form-group" style="margin-bottom:10px;">
                <input type="text" id="searchPhone" placeholder="연락처 입력('-' 포함)">
            </div>
            <button type="button" onclick="searchReservation()" style="background:#28a745; margin-top:0;">내 예약 조회하기</button>
            <div id="searchResult" style="margin-top:15px;"></div>
        </div>
    </div>

    <script>
        let globalCounts = [];
        let allReservations = [];

        async function loadCounts() {
            try {
                const res = await fetch('/api/shoe-counts');
                globalCounts = await res.json();
                
                const resAll = await fetch('/api/reservations');
                allReservations = await resAll.json();

                updateSizes(); 
                if (document.getElementById('date').value) {
                    loadTimeSlots();
                }
            } catch (err) {
                console.error(err);
            }
        }

        async function loadTimeSlots() {
            const selectedDate = document.getElementById('date').value;
            const timeSelect = document.getElementById('time');
            
            if (!selectedDate) {
                timeSelect.innerHTML = '<option value="">날짜를 먼저 선택하세요</option>';
                timeSelect.disabled = true;
                return;
            }

            try {
                const res = await fetch(`/api/time-slots?date=${encodeURIComponent(selectedDate)}`);
                const slots = await res.json();
                timeSelect.innerHTML = '<option value="">시간을 선택하세요</option>';
                timeSelect.disabled = false;
                
                slots.forEach(slot => {
                    // 해당 날짜 + 해당 시간대에 이미 예약된 인원 수 계산 (최대 3명 제한)
                    const slotCount = allReservations.filter(item => item.date === selectedDate && item.time === slot.time && item.status !== 'cancelled').length;
                    
                    const opt = document.createElement('option');
                    opt.value = slot.time;
                    
                    if (!slot.is_active || slotCount >= 3) {
                        opt.textContent = `${slot.time} (${slotCount >= 3 ? `마감 3/3` : '관리자 마감'})`;
                        opt.disabled = true;
                        opt.className = 'disabled-slot';
                    } else {
                        opt.textContent = `${slot.time} (신청 가능 ${slotCount}/3)`;
                    }
                    timeSelect.appendChild(opt);
                });
            } catch (err) {
                console.error(err);
            }
        }

        function updateSizes() {
            const brand = document.getElementById('brand').value;
            const sizeSelect = document.getElementById('shoeSize');
            const sizeNotice = document.getElementById('sizeNotice');
            
            sizeSelect.innerHTML = '<option value="">사이즈를 선택하세요</option>';
            if (!brand) {
                sizeSelect.disabled = true;
                sizeNotice.textContent = '';
                return;
            }

            sizeSelect.disabled = false;
            for (let size = 220; size <= 300; size += 5) {
                const count = globalCounts.filter(item => item.brand === brand && Number(item.shoe_size) === size && item.status !== 'cancelled').length;
                const opt = document.createElement('option');
                opt.value = size;

                if (count >= 3) {
                    opt.textContent = `${size}mm (마감 3/3)`;
                    opt.disabled = true;
                    opt.className = 'disabled-slot';
                } else {
                    opt.textContent = `${size}mm (신청 가능 ${count}/3)`;
                }
                sizeSelect.appendChild(opt);
            }
            sizeNotice.textContent = '* 각 사이즈별 신청 인원은 최대 3명으로 제한되며, 3명이 차면 자동 마감됩니다.';
        }

        document.getElementById('reservationForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            // 프론트엔드 필수 입력 검증 및 알림
            const name = document.getElementById('name').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const department = document.getElementById('department').value.trim();
            const studentId = document.getElementById('studentId').value.trim();
            const brand = document.getElementById('brand').value;
            const shoeSize = document.getElementById('shoeSize').value;
            const date = document.getElementById('date').value;
            const time = document.getElementById('time').value;
            const privacyAgreed = document.getElementById('privacyAgreed').checked;

            if (!name) { alert('이름을 입력해주세요.'); document.getElementById('name').focus(); return; }
            if (!phone) { alert('연락처를 입력해주세요.'); document.getElementById('phone').focus(); return; }
            if (!department) { alert('소속(학과)을 입력해주세요.'); document.getElementById('department').focus(); return; }
            if (!studentId) { alert('학번을 입력해주세요.'); document.getElementById('studentId').focus(); return; }
            if (!brand) { alert('신발 브랜드를 선택해주세요.'); document.getElementById('brand').focus(); return; }
            if (!shoeSize) { alert('신발 사이즈를 선택해주세요.'); document.getElementById('shoeSize').focus(); return; }
            if (!date) { alert('방문 예약 날짜를 선택해주세요.'); document.getElementById('date').focus(); return; }
            if (!time) { alert('예약 시간을 선택해주세요.'); document.getElementById('time').focus(); return; }
            if (!privacyAgreed) { alert('개인정보 수집 및 이용에 동의해주세요.'); document.getElementById('privacyAgreed').focus(); return; }

            const payload = { name, phone, department, studentId, brand, shoeSize, date, time, privacyAgreed };

            try {
                const res = await fetch('/api/reservations', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const result = await res.json();
                alert(result.message);
                if (result.success) location.reload();
            } catch (err) {
                alert('서버 통신 중 오류가 발생했습니다.');
            }
        });

        async function searchReservation() {
            const phone = document.getElementById('searchPhone').value;
            if (!phone) return alert('연락처를 입력해주세요.');

            const res = await fetch(`/api/reservations/search?phone=${phone}`);
            const data = await res.json();
            const div = document.getElementById('searchResult');

            if (data.length === 0) {
                div.innerHTML = '<p style="color:red;">예약 내역이 없습니다.</p>';
                return;
            }

            let html = '';
            data.forEach(item => {
                html += `
                    <div style="background:#fff; border:1px solid #ccc; padding:10px; border-radius:5px; margin-bottom:8px;">
                        <b>${item.name}</b> (${item.department} / 학번: ${item.studentId})<br>
                        신청 브랜드/사이즈: ${item.brand} (${item.shoe_size}mm)<br>
                        방문 일정: ${item.date} ${item.time}<br>
                        <button onclick="cancelReservation(${item.id})" style="background:#dc3545; padding:6px; font-size:14px; margin-top:8px;">예약 취소하기</button>
                    </div>
                `;
            });
            div.innerHTML = html;
        }

        async function cancelReservation(id) {
            if (!confirm('정말 예약을 취소하시겠습니까?')) return;
            const res = await fetch(`/api/reservations/${id}`, { method: 'DELETE' });
            const result = await res.json();
            alert(result.message);
            if (result.success) location.reload();
        }

        // 페이지 진입 시 데이터 로드
        loadCounts();
    </script>
</body>
</html>
